name: API

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  service-tests:
    name: REST service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Run service tests
        run: pytest tests/service -q --tb=short

      - name: Export OpenAPI description
        run: python -c "import json; from vdsim.service.app import create_app; json.dump(create_app().openapi(), open('openapi.json', 'w'), indent=2)"

      - uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: openapi.json

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: service-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t motion-engine:ci .

      - name: Smoke test
        run: |
          docker run -d --name me -p 8000:8000 -e MOTIONENGINE_API_KEY=ci-key motion-engine:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS -H "X-API-Key: ci-key" http://127.0.0.1:8000/vehicle/mid_size_sedan > /dev/null
          curl -fsS -H "X-API-Key: ci-key" -H "Content-Type: application/json" \
            -d '{"model":"bicycle_linear","maneuver":"step_steer","duration":2}' http://127.0.0.1:8000/simulate > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/vehicle)" = "401"
          docker logs me
          docker rm -f me
