[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-engine"
version = "0.1.0"
description = "Open-source framework for motion planning, trajectory optimization, vehicle dynamics simulation, and autonomous driving research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Aljoscha Vivien Schmidt"},
]
keywords = [
    "motion-planning",
    "trajectory-planning",
    "vehicle-dynamics",
    "autonomous-driving",
    "MPC",
    "path-optimization",
    "motion-prediction",
    "ADAS",
    "robotics",
    "simulation",
    "self-driving",
    "control-systems",
    "bicycle-model",
    "Frenet-frame",
    "Werling-planner",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.5",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=3.0",
]

[project.urls]
Homepage = "https://github.com/alivsch-ai-code/MotionEngine"
Documentation = "https://github.com/alivsch-ai-code/MotionEngine/tree/main/docs"
Repository = "https://github.com/alivsch-ai-code/MotionEngine"
Issues = "https://github.com/alivsch-ai-code/MotionEngine/issues"

[project.scripts]
motion-engine = "vdsim.gui.app:main"
motion-engine-scenario = "run_scenario:main"

[tool.setuptools.packages.find]
include = ["vdsim*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "NPY",  # numpy-specific
]
ignore = [
    "E501",    # line length is left to the formatter
    "E702",    # compact one-line state updates are project style
    "E741",    # l, I, etc. are standard symbols in the equations
    "B007",    # unused loop variables document the unpacked structure
    "B905",    # zip-strict needs Python 3.10 compatibility review
    "NPY201",  # np.trapz is guarded with hasattr for NumPy 1.x and 2.x
    "B008",    # immutable call results as defaults are intentional
    "B023",    # closures here are called inside the loop that defines them
    "B027",    # optional no-op hooks on abstract base classes
    "B028",    # warnings in tests need no stacklevel
    "B904",    # transpiler re-raises with its own message
    "E402",    # lazy Qt imports after environment setup
    "E721",    # exact type comparison is required by the MATLAB runtime
    "E731",    # short named lambdas are used for local helpers
    "E743",    # l() is the wheelbase function of the Werling models
    "UP031",   # printf format kept in generated text
]

[tool.ruff.lint.per-file-ignores]
# Known unused locals: review and remove these, then drop the entries
"examples/stabilization/reverse_maneuver.py" = ["F841"]
"vdsim/ad/runner.py" = ["F841"]
"vdsim/matlab/analysis.py" = ["F841"]
"vdsim/planning/planner.py" = ["F841"]
"vdsim/research/metrics.py" = ["F841"]
"vdsim/viz3d/cosim.py" = ["F841"]
"vdsim/viz3d/road_export.py" = ["F841"]
"run_3d.py" = ["F401"]  # availability probe for the optional carla package

[tool.ruff.lint.isort]
known-first-party = ["vdsim"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
# The code base is not annotated yet (see ROADMAP v0.2); these two codes flag only that
disable_error_code = ["assignment", "var-annotated"]

[tool.coverage.run]
# Both packages need optional extras that the coverage job does not install
omit = ["vdsim/gui/*", "vdsim/viz3d/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gui: marks tests that require a display",
    "integration: marks integration tests that test multiple components together",
    "benchmark: marks performance regression tests",
]
