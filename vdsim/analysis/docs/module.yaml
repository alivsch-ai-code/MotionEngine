id: analysis
title: Fahrzeuganalyse – linear und quasi-statisch
summary: Kennwerte eines Fahrzeugs ohne Simulation – Eigenlenkgradient, Verstärkungen, Eigenwerte, Frequenzgang, Radlasten, Wankgradient, Rollachse, Lenkkinematik.
purpose: |
  Viele Fahrzeugeigenschaften folgen direkt aus den Parametern. Die analytischen Werte dienen als
  schnelle Auslegungshilfe (z. B. Parameterstudie Schräglaufsteifigkeit gegen Eigenlenkgradient) und als
  Referenz, gegen die die Simulationsmodelle getestet werden.
architecture: |
  - `linear_analysis.LinearSingleTrackAnalysis`: nutzt `LinearBicycleModel.state_space()`; Eigenlenkgradient,
    charakteristische und kritische Geschwindigkeit, stationäre Verstärkungen, Eigenwerte, Bode-Daten, Zusammenfassung.
  - `quasi_static.QuasiStaticAnalysis`: Rollachse, Wankgradient, Wanksteifigkeitsverteilung, Radlasten bei
    konstanter Längs- und Querbeschleunigung, Querlastverteilung (LLTD), Abhebegrenze, Sturz, Ackermann-Winkel, Wendekreis.
design_decisions:
  - decision: Lineare Analyse auf dem identischen Modell, das auch simuliert wird
    reason: Test „lineares Modell gleich Analyse“ ist exakt; Achssteifigkeiten kommen aus dem eingestellten Reifenmodell
  - decision: Quasi-statische Lasten mit denselben Formeln wie das Zweispurmodell
    reason: Validierung des Zweispurmodells innerhalb 2–3 %
implementation:
  - "Eigenfrequenz aus dem Produkt der Eigenwerte (Determinante von A), Dämpfung aus deren Summe (Spur von A)."
  - "Die Abhebegrenze wird durch Abtasten von a_y bis 30 m/s² bestimmt (600 Stützstellen)."
configuration:
  - name: speeds
    description: Geschwindigkeiten der Zusammenfassung (Standard 10, 20, 30, 40 m/s)
    unit: m/s
examples:
  - run_scenario.py
limitations:
  - Linear – keine Aussage über den Grenzbereich; Lastverlagerung und Reifendegression fehlen in der linearen Analyse.
  - Quasi-statisch – keine Dynamik der Wankbewegung, keine Elastokinematik.
  - Der Wendekreis nutzt eine einfache Geometrie (äußeres Vorderrad, Fahrzeugüberhang).
validation:
  - test: tests/test_vehicle_models.py
    shows: Gierverstärkung des linearen Modells gleich der analytischen Lösung; Wankgradient und Radlasten des Zweispurmodells gegen die quasi-statische Analyse
references: [mitschke2014, rajamani2012, milliken1995, iso4138]
concepts: [understeer_gradient, linear_stability_analysis, quasi_static_wheel_loads, ackermann_steering]
related_modules: [vehicle_models, reporting, visualization]
extension_points:
  - Weitere Kennwerte als Methoden; die GUI (Tab „Kennwerte“) zeigt summary() automatisch
