id: planning
title: Trajektorienplanung nach Werling
summary: Zeitlich konsistente, sampling-basierte Trajektorienplanung in Frenet-Koordinaten mit kombinierter Quer- und Längsoptimierung, Kollisionsprüfung und Bi-level-Stabilisierung (Werling 2011, Kap. 2–3, Anh. A).
purpose: |
  Das Paket erzeugt im 10-Hz-Takt Solltrajektorien für die Trajektorienregelung. Es setzt die
  Optimierungsheuristik von Werling um: Gewählt wird die beste Lösung aus der Funktionenklasse der
  unrestringierten Optimallösung (quintische bzw. quartische Polynome), die alle Restriktionen einhält.
  Dank absolutem Endzeitraster und exakter Fortsetzung der alten Trajektorie ist die Planung bei
  inaktiven Restriktionen zeitlich konsistent (Bellman-Prinzip, Satz 3). Das macht sie unabhängig von
  der Planungsfrequenz, und eine Low-level-Stabilisierung kann darauf aufsetzen.
architecture: |
  `WerlingPlanner.plan_cycle()` folgt Abschn. 3.5.5:
  1. **Startzustand** (`planner._start_state`): exakte Auswertung des alten `TrajectoryPlan` zu t0 + t_comp
     oder Reinitialisierung aus der Prädiktion (`kinematics.taylor_prediction`, 4.5.2).
  2. **Regime/Quermodus**: d(t) mit Schwerpunkt oder d(s) mit Hinterachse (Hysterese um v_s), Projektion (A.2).
  3. **Kandidatensätze**: `lateral.build_lateral_set`, `longitudinal.build_longitudinal_set` mit
     `polynomials` (3.8) und geschlossenem Ruckintegral, Kosten über `cost.CostModel`, Frenet-Vorfilter.
  4. **Kombination** (`combination.CandidateEvaluator`): (3.2), Rücktransformation A.1 lazy in Batches.
  5. **Prüfung** (`selection.select_mode`): Restriktions-Plugins (`constraints`) und Kollisionsprüfer
     (`collision`), erste gültige = beste; Re-Ranking nicht separierbarer Kostenterme.
  6. **Ablösestrategie/Fallback** (`selection.choose_mode`, `choose_fallback`).
  Ausgabe: `PlannedTrajectory` (alte Trajektorie bis t0 + t_comp, dann neue; `plan` = exakte Polynome)
  und `PlannerDebug`. Analysen (3.12)–(3.14) in `analysis`; Vergleichsplaner in `baselines`.
design_decisions:
  - decision: Absolutes Endzeitraster T_k = k·Δτ (bzw. Endpositionsraster S_k = k·Δs im d(s)-Modus)
    reason: Der Rest der alten Optimaltrajektorie ist im neuen Satz enthalten (Satz 3)
    alternatives: relatives Raster (trajectory_planner/frenet_naive, nicht konsistent)
  - decision: Schutz des alten Endzeitpunkts unterhalb von τ_min
    reason: Beim Absinken des kleinsten τ bliebe die alte Lösung sonst kurz vor Erreichen der Mannigfaltigkeit nicht verfügbar
    alternatives: sehr kleines τ_min allein (numerisch extreme Polynome)
  - decision: Plan als Polynomkoeffizienten statt Abtastwerte
    reason: exakte Startzustände, Konsistenzfehler im Bereich der Maschinengenauigkeit
    alternatives: Interpolation der Ausgabe (Konsistenzfehler ~ Interpolationsfehler)
  - decision: Kollisionsprüfung nur für restriktionskonforme Kandidaten, Referenzkurve je Längssatz einmal ausgewertet
    reason: Rechenzeit; der Fallback nutzt bei Restriktionsverletzung den Verletzungszeitpunkt
    alternatives: vollständige Prüfung aller Kandidaten
  - decision: Fallback mit Gleichstandsauflösung über die Geschwindigkeit im Kollisionszeitpunkt
    reason: Kollisionszeiten sind auf das Prüfraster quantisiert; Werling folgt der Trajektorie mit maximal zulässiger Verzögerung
    alternatives: billigste unter den längsten (bremst nicht)
  - decision: Grobes Endgeschwindigkeitsraster bis zum Stillstand im Geschwindigkeitsmodus
    reason: Ohne langsamere Endgeschwindigkeiten bleiben hinter langsamerem Verkehr nur Anhaltekandidaten gültig; die Ablösestrategie würde dann anhalten
    alternatives: nur ν ∈ [−ν_max, ν_max] und Anhaltekandidaten
implementation:
  - Koeffizienten (3.8) in geschlossener Form, vektorisiert für alle (δ_i, τ_j); Ruckintegral analytisch
  - Lazy-Auswertung mit wachsenden Batches (32 … 1024) in aufsteigender Kostenreihenfolge, Budget max_checks
  - Weltkoordinaten ausschließlich über ReferenceLine.to_cartesian (A.1); d(t) über (A.7), (A.8) mit Schutz bei ṡ → 0
  - dκ/dℓ aus exakter Zeitableitung von κ bzw. im d(s)-Modus geometrisch (robust bei v ≈ 0)
  - Plugins über @component (kind constraint, cost_term, collision_checker), Gewichte nur in Parametern
  - Konfigurationsprüfung beim reset(): Einrast-Analyse (Bemerkung 2) und Samplinghorizont (Bemerkung 1)
configuration:
  - name: sampling.absolute_grid
    description: absolutes Endzeitraster (Standard true); false = relatives Raster ohne Konsistenz
  - name: sampling.lat_tau_step / lat_tau_max / lat_d_step / lat_d_range
    description: Raster der Querkandidaten d(t) (Δτ = 0.5 s bis 5 s, δ = ±3.5 m in 0.5 m)
  - name: sampling.arc_s_step / arc_s_max
    description: Endpositionsraster d(s) (1 m bis 20 m)
  - name: sampling.lon_tau_step / lon_tau_max / lon_nu_* / lon_sigma_*
    description: Raster der Längskandidaten (Δτ = 1 s bis 8 s, ν = ±4 m/s fein + grob bis Stillstand, σ = ±3 m)
  - name: cost.terminal_time.k_tau_lat / cost.terminal_deviation.k_delta
    description: Werling-Gewichte k_τ, k_δ (5, 200); Einrasten nach Bemerkung 2 geprüft
  - name: cost.k_lat / cost.k_lon
    description: Gewichtung von Quer- und Längskosten (3.2), Werling 1 und k_s
  - name: constraints.<name>.enabled / Grenzwerte
    description: jede Restriktion einzeln aktivierbar und parametrierbar
  - name: collision.horizon / collision.margin_<typ> / collision.margin_ramp
    description: Prüfhorizont 3 s, Sicherheitsabstände je Objekttyp, Aufbau über Δt (Abb. 3.10)
  - name: timing.t_comp
    description: konservative Rechenzeit; Start der neuen Polynome bei t + t_comp
  - name: stabilization.strategy
    description: bilevel (Standard), low_level, high_level
  - name: configs/planning/{default,comfort,sporty}.json
    description: fertige Parametrierungen, laden mit vdsim.planning.create_planner(name)
examples:
  - examples/planning/lane_change.py
  - examples/planning/following.py
  - examples/planning/stopping.py
  - examples/planning/evasion.py
  - examples/planning/consistency.py
  - examples/custom_nodes/python/my_cost_function.py
  - examples/custom_nodes/python/my_collision_checker.py
limitations:
  - zeitliche Konsistenz nur bei inaktiven Restriktionen und ausschließlich konsistenten Kostentermen
  - Funktionenklasse auf doppelte Kursänderung beschränkt; enge, labyrinthartige Situationen sind nicht lösbar (3.5.4)
  - in blockierten Situationen (viele kollidierende Kandidaten) steigt die Rechenzeit auf 100–300 ms
  - zeitdiskrete Kollisionsprüfung (Raster 0.1 s), Kreisapproximation konservativ
  - Richtungswechsel nur im Stillstand über die Verhaltensebene; Ein- und Ausparken mit großen Differenzwinkeln nicht vorgesehen
  - Regimewechsel cog ↔ rear_axle mit kleinem Positionssprung (vernachlässigter Schwimmwinkel l_h κ)
validation:
  - test: tests/planning/test_planning_consistency.py
    shows: Bellman-Konsistenz < 1e-6 (gemessen ~1e-14) für d(t), Folgen und d(s); Unabhängigkeit von der Planungsperiode; naive Variante inkonsistent; Reinitialisierung und Strategien
  - test: tests/planning/test_planning_polynomials.py
    shows: Randbedingungen quintisch/quartisch, Ruckintegral geschlossen = numerisch, Kosten nach Tab. 3.1, absolutes Raster
  - test: tests/planning/test_planning_modes.py
    shows: Spurwechsel gerade und gekrümmt, Folgen auf k0 + kv v, Anhalten exakt an s_stop, Einfädeln, Ablösestrategie, d(s), Rückwärtsfahrt
  - test: tests/planning/test_planning_collision.py
    shows: Kreisüberdeckung, Sicherheitsrampe, dynamische Kollision, Ausweichen, Fallback
  - test: tests/planning/test_planning_plugins.py
    shows: Restriktions- und Kosten-Plugins, eigene Plugins, Konfigurationen, Debug-Daten, Laufzeit
  - test: tests/planning/test_planning_analysis.py
    shows: (3.11)–(3.14), Einrast-Warnung, Horizontabschätzung
references: [werling2011, werling2010icra, werling2012ijrr, ziegler2010iv, bellman1957, bryson1975, kamm1936, mitschke2004]
concepts: [quintic_polynomial, quartic_polynomial, jerk_integral, continuous_manifold, sampling_horizon, lock_in,
           absolute_time_grid, bellman_principle, frenet_transformation, lateral_sampling, reference_point,
           longitudinal_sampling, following_mode, merging_mode, candidate_combination, multi_objective_cost,
           lazy_selection, replacement_strategy, fallback, kinematic_constraints, corridor_constraint,
           collision_circles, safety_margin_ramp, motion_prediction, bilevel_stabilization]
related_modules: [geometry, stabilization, behavior, prediction, ad]
extension_points:
  - Neue Kostenterme über @component(kind="cost_term") oder cost.custom = [{spec, params}]
  - Neue Restriktionen über @component(kind="constraint") oder constraints.custom
  - Eigene Kollisionsprüfer über @component(kind="collision_checker") oder collision.checker = "python:…"
  - Eigene Planervarianten als Unterklasse von WerlingPlanner (siehe baselines.py)
