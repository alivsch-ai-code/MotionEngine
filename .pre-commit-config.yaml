repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: motionengine-agent-review
        name: MotionEngine agent review (advisory)
        entry: python scripts/review_agents.py
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
