# Quellen der Fahrdynamik-Plattform (bestehende Pakete) und des Wissenssystems.
# Format: docs/templates/MODULE_DOCS.md. Unsichere Details (Seitenzahlen, ISBN) sind bewusst weggelassen.

# ---------------------------------------------------------------- Fachbücher Fahrdynamik
mitschke2014:
  type: book
  authors: [Manfred Mitschke, Henning Wallentowitz]
  title: Dynamik der Kraftfahrzeuge
  year: 2014
  edition: 5. Auflage
  publisher: Springer Vieweg
  notes: Standardwerk zu Längs-, Quer- und Vertikaldynamik, Einspurmodell, Eigenlenkverhalten, Bremskraftverteilung, Fahrkomfort.
schramm2018:
  type: book
  authors: [Dieter Schramm, Manfred Hiller, Roberto Bardini]
  title: Modellbildung und Simulation der Dynamik von Kraftfahrzeugen
  year: 2018
  publisher: Springer Vieweg
  notes: Mehrkörpermodellierung, Zweispur- und Gesamtfahrzeugmodelle, Reifen- und Fahrbahnmodelle.
milliken1995:
  type: book
  authors: [William F. Milliken, Douglas L. Milliken]
  title: Race Car Vehicle Dynamics
  year: 1995
  publisher: SAE International
  notes: g-g-Diagramm (GGV), Reibkreis, Eigenlenkverhalten, Radlastverlagerung.
reif2010:
  type: book
  authors: [Konrad Reif]
  title: Bremsen und Bremsregelsysteme
  year: 2010
  publisher: Vieweg+Teubner (Bosch Fachinformation Automobil)
  notes: Herausgeberwerk. Bremsanlage, Bremskraftverteilung, ABS, ASR, ESP.

# ---------------------------------------------------------------- Numerik
hairer1993:
  type: book
  authors: [Ernst Hairer, Syvert P. Nørsett, Gerhard Wanner]
  title: "Solving Ordinary Differential Equations I: Nonstiff Problems"
  year: 1993
  edition: 2nd revised edition
  publisher: Springer (Springer Series in Computational Mathematics 8)
  notes: Runge-Kutta-Verfahren, Ordnung, Fehlerabschätzung, Schrittweitensteuerung.
hairer1996:
  type: book
  authors: [Ernst Hairer, Gerhard Wanner]
  title: "Solving Ordinary Differential Equations II: Stiff and Differential-Algebraic Problems"
  year: 1996
  edition: 2nd revised edition
  publisher: Springer (Springer Series in Computational Mathematics 14)
  notes: Steifheit und Stabilitätsgebiete expliziter Verfahren (Grundlage für stable_dt).
butcher2016:
  type: book
  authors: [John C. Butcher]
  title: Numerical Methods for Ordinary Differential Equations
  year: 2016
  edition: 3rd edition
  publisher: Wiley
  notes: Runge-Kutta-Theorie, Butcher-Tableau, lineare Stabilität.
virtanen2020:
  type: paper
  authors: [Pauli Virtanen, Ralf Gommers, Travis E. Oliphant, et al.]
  title: "SciPy 1.0: fundamental algorithms for scientific computing in Python"
  year: 2020
  venue: Nature Methods 17
  doi: 10.1038/s41592-019-0686-2
  notes: solve_ivp (adaptiver Löser), lsq_linear (MPC, Ideallinie), Signalverarbeitung (ISO-2631-Filter, Welch).
stark1995:
  type: paper
  authors: [Philip B. Stark, Robert L. Parker]
  title: "Bounded-Variable Least-Squares: an Algorithm and Applications"
  year: 1995
  venue: Computational Statistics 10
  notes: BVLS-Verfahren, das scipy.optimize.lsq_linear(method="bvls") umsetzt.
deboor2001:
  type: book
  authors: [Carl de Boor]
  title: A Practical Guide to Splines
  year: 2001
  edition: revised edition
  publisher: Springer (Applied Mathematical Sciences 27)
  notes: Hermite-Interpolation und Splines (Referenzkurve in vdsim.geometry).

