<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">MotionEngine – Option C: autonomous vehicle</title>
  <defs>
    <radialGradient id="gc" cx="32" cy="40" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0.25" stop-color="#06B6D4" stop-opacity=".45"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="fov"><path d="M32 40 L6 4 H58 Z"/></clipPath>
  </defs>
  <!-- sensor field of view with range rings -->
