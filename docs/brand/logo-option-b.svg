<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">MotionEngine – Option B: M as a trajectory</title>
  <defs>
    <linearGradient id="gb" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- the letter M as one continuous path whose last stroke turns into the planned trajectory -->
  <path d="M8 52 V22 C8 12 18 10 22 18 L27 28 L32 18 C36 10 46 12 46 22 V36 C46 46 50 50 56 50"
        fill="none" stroke="url(#gb)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- vehicle heading along the trajectory -->
  <path d="M55 44 L63 50 L55 56 L57.5 50 Z" fill="#06B6D4"/>
</svg>
