# docker compose up --build   ->  web app http://localhost:8000, API reference http://localhost:8000/docs
services:
  api:
    build: .
    image: motion-engine:latest
    ports:
      - "8000:8000"
    environment:
      MOTIONENGINE_API_KEY: ${MOTIONENGINE_API_KEY:-}
      MOTIONENGINE_MAX_CONCURRENCY: ${MOTIONENGINE_MAX_CONCURRENCY:-2}
      MOTIONENGINE_MAX_SIM_TIME: ${MOTIONENGINE_MAX_SIM_TIME:-120}
      MOTIONENGINE_MAX_WALL_TIME: ${MOTIONENGINE_MAX_WALL_TIME:-60}
      MOTIONENGINE_ALLOWED_MODEL_HOSTS: ${MOTIONENGINE_ALLOWED_MODEL_HOSTS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MOTIONENGINE_CHAT_MODEL: ${MOTIONENGINE_CHAT_MODEL:-claude-opus-5-5}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - models:/data/models
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

volumes:
  models:
